name: Published smoke test

on:
    push:
        branches:
            - ati-public-tests
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            INSTALLER_URL: https://github.com/matlab/agentic-toolkit-installer/releases/latest/download/agentic-toolkit-installer-linux-x64
            LOG_FOLDER: ${{ github.workspace }}/installer-logs
            MW_AGENTIC_TOOLKIT_INSTALLER_GIT_TOKEN: ${{ github.token }}
        steps:
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Install the agent CLIs
              run: npm install --global @anthropic-ai/claude-code @openai/codex @github/copilot

            - name: Set up MATLAB
              uses: matlab-actions/setup-matlab@v3
              with:
                  release: latest
                  products: Simulink
                  cache: true

            - name: Start MATLAB as the installer does
              run: |
                  set +e
                  timeout --kill-after=10s 180 matlab -nosplash -nodesktop -logfile matlab-start.log -r "disp(version); exit(0);"
                  echo "MATLAB exit code: $?"
                  cat matlab-start.log || echo "MATLAB wrote no log."

            - name: Download the latest installer release
              run: |
                  curl --fail --location --silent --show-error --output agentic-toolkit-installer "$INSTALLER_URL"
                  chmod +x agentic-toolkit-installer

            - name: Install
              timeout-minutes: 10
              run: ./agentic-toolkit-installer install --non-interactive --disable-telemetry --log-folder "$LOG_FOLDER"

            - name: Configure
              run: ./agentic-toolkit-installer configure --non-interactive --log-folder "$LOG_FOLDER"

            - name: Status
              run: ./agentic-toolkit-installer status --log-folder "$LOG_FOLDER"

            - name: Uninstall
              run: ./agentic-toolkit-installer uninstall --non-interactive --log-folder "$LOG_FOLDER"

            - name: Keep the installer logs
              if: failure() || cancelled()
              uses: actions/upload-artifact@v7
              with:
                  name: installer-logs
                  path: |
                      ${{ env.LOG_FOLDER }}
                      /tmp/agentic-toolkit-installer-mltbx-*/*.log
                      matlab-start.log
