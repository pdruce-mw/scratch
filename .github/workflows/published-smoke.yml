# Copyright 2026 The MathWorks, Inc.
name: Published smoke test

on:
    push:
        branches:
            - ati-public-tests
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            INSTALLER_URL: ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.sha }}/installer/agentic-toolkit-installer-linux-x64
            LOG_FOLDER: ${{ github.workspace }}/installer-logs
            MW_AGENTIC_TOOLKIT_INSTALLER_GIT_TOKEN: ${{ github.token }}
        steps:
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Install the agent CLIs
              run: npm install --global @anthropic-ai/claude-code @openai/codex @github/copilot

            - name: Set up MATLAB
              uses: matlab-actions/setup-matlab@v3
              with:
                  release: latest
                  products: Simulink
                  cache: true

            - name: Provide the MATLAB license
              env:
                  MATLAB_LICENSE: ${{ secrets.MATLAB_LICENSE }}
              run: |
                  : "${MATLAB_LICENSE:?Set the MATLAB_LICENSE secret to the content of a MATLAB license file}"
                  printf '%s\n' "$MATLAB_LICENSE" > "$RUNNER_TEMP/matlab.lic"
                  echo "MLM_LICENSE_FILE=$RUNNER_TEMP/matlab.lic" >> "$GITHUB_ENV"

            - name: Download the installer built from main
              run: |
                  curl --fail --location --silent --show-error --output agentic-toolkit-installer "$INSTALLER_URL"
                  chmod +x agentic-toolkit-installer

            - name: Install
              timeout-minutes: 10
              run: ./agentic-toolkit-installer install --non-interactive --disable-telemetry --log-folder "$LOG_FOLDER"

            - name: Configure
              run: ./agentic-toolkit-installer configure --non-interactive --log-folder "$LOG_FOLDER"

            - name: Status
              run: ./agentic-toolkit-installer status --log-folder "$LOG_FOLDER"

            - name: Uninstall
              run: ./agentic-toolkit-installer uninstall --non-interactive --log-folder "$LOG_FOLDER"

            - name: Check how MATLAB is licensed
              if: always()
              run: |
                  set +e
                  env | cut -d= -f1 | grep '^MLM_' || echo "No MLM_ variables are set."
                  timeout 5m matlab -batch "disp(version)"
                  echo "matlab -batch exit code: $?"
                  MW_BATCH_LICENSING_ONLINE=true timeout 5m matlab-batch "disp(version)"
                  echo "matlab-batch exit code: $?"

            - name: Keep the installer logs
              if: failure() || cancelled()
              uses: actions/upload-artifact@v7
              with:
                  name: installer-logs
                  path: |
                      ${{ env.LOG_FOLDER }}
                      /tmp/agentic-toolkit-installer-mltbx-*/*.log

    report:
        needs: smoke
        if: always() && needs.smoke.result != 'skipped'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Open, comment on, or close the failure issue
              uses: actions/github-script@v9
              env:
                  SMOKE_RESULT: ${{ needs.smoke.result }}
              with:
                  script: |
                      const reportSmokeResult = require('./.github/scripts/src/report-smoke-result.js');
                      return reportSmokeResult({ github, context, core, result: process.env.SMOKE_RESULT });
